<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:412px;height:915px;overflow:hidden;background:#FBF8FF}
body{font-family:"Roboto","Inter","Liberation Sans",sans-serif;color:#1D1B20;letter-spacing:-0.1px;-webkit-font-smoothing:antialiased}
svg.ic{display:block;flex:none}
.phone{position:relative;width:412px;height:915px;overflow:hidden;background:#FBF8FF;display:flex;flex-direction:column}
.status{height:24px;flex:none;background:#3949AB;color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 10px 0 16px;font-size:13px;font-weight:500;letter-spacing:.2px}
.status .sicons{display:flex;gap:5px;align-items:center}
.app{flex:1;position:relative;display:flex;flex-direction:column;overflow:hidden;margin-bottom:18px;background:#FBF8FF}
.mockup-label{position:absolute;left:0;right:0;bottom:0;height:18px;background:#E6E6EE;color:#5A5D6E;font-size:10.5px;font-weight:500;display:flex;align-items:center;justify-content:center;letter-spacing:.4px;z-index:100;border-top:1px solid #D6D6E0}
/* tipografia (Type.kt + default M3) */
.t-tl{font-size:20px;line-height:28px;font-weight:600}
.t-tm{font-size:16px;line-height:24px;font-weight:500}
.t-ts{font-size:14px;line-height:20px;font-weight:500}
.t-bl{font-size:16px;line-height:24px}
.t-bm{font-size:14px;line-height:20px}
.t-bs{font-size:12px;line-height:16px;letter-spacing:.1px}
.t-ll{font-size:14px;line-height:20px;font-weight:500}
.t-lm{font-size:12px;line-height:16px;font-weight:500;letter-spacing:.2px}
.t-lsm{font-size:11px;line-height:16px;font-weight:500;letter-spacing:.2px}
.t-hs{font-size:24px;line-height:32px}
.onsv{color:#46464F}
.prim{color:#3949AB}
.outl{color:#777680}
.center{text-align:center}
.row{display:flex;align-items:center}
.col{display:flex;flex-direction:column}
.f1{flex:1;min-width:0}
/* MdrBanner */
.mdr{flex:none;height:28px;background:#FCE7D9;display:flex;align-items:center;padding:0 16px;gap:8px}
/* TopAppBar small */
.topbar{flex:none;height:64px;display:flex;align-items:center;padding:0 4px;background:#FBF8FF}
.iconbtn{width:48px;height:48px;display:flex;align-items:center;justify-content:center;flex:none}
.topbar .title{flex:1;min-width:0;padding-left:8px}
/* card */
.card{background:#E6E0E9;border-radius:12px}
/* buttons */
.btn{height:40px;border-radius:20px;background:#3949AB;color:#fff;display:flex;align-items:center;justify-content:center;gap:8px;font-size:14px;font-weight:500;line-height:20px;padding:0 24px}
.btn.outlined{background:transparent;color:#3949AB;border:1px solid #777680}
.btn.disabled{background:rgba(29,27,32,.12);color:rgba(29,27,32,.38)}
.tbtn{height:40px;display:inline-flex;align-items:center;gap:4px;padding:0 12px;color:#3949AB;font-size:14px;font-weight:500;border-radius:20px;white-space:nowrap}
/* outlined text field */
.otf{position:relative;height:56px;border:1px solid #777680;border-radius:4px;display:flex;align-items:center;padding:0 0 0 16px}
.otf .lab{position:absolute;left:12px;top:-9px;padding:0 4px;font-size:12px;line-height:16px;color:#46464F;background:var(--bgc,#FBF8FF);letter-spacing:.1px;white-space:nowrap}
.otf .val{flex:1;min-width:0;font-size:16px;line-height:24px;white-space:nowrap;overflow:hidden}
.otf .trail{width:48px;height:48px;display:flex;align-items:center;justify-content:center;flex:none}
/* chips */
.chip{height:32px;border-radius:8px;border:1px solid #777680;display:inline-flex;align-items:center;gap:8px;padding:0 16px;font-size:14px;font-weight:500;color:#46464F;white-space:nowrap}
.chip.sel{background:#DFE0F9;border-color:transparent;color:#171B2C}
.chip.sel.icon{padding-left:8px}
/* nav bar */
.navbar{position:absolute;left:0;right:0;bottom:0;height:80px;background:#F3EDF7;display:flex}
.navitem{flex:1;display:flex;flex-direction:column;align-items:center;padding-top:12px}
.navitem .ind{width:64px;height:32px;border-radius:16px;display:flex;align-items:center;justify-content:center}
.navitem.sel .ind{background:#DFE0F9}
.navitem .nl{margin-top:4px;font-size:12px;line-height:16px;font-weight:500;letter-spacing:.2px;color:#46464F}
.navitem.sel .nl{color:#1D1B20}
/* brand */
.brandheader{position:relative;overflow:hidden;border-radius:0 0 28px 28px;padding:14px 20px 22px}
.brandheader > *{position:relative;z-index:1}
.bubble{position:absolute;border-radius:50%;background:#fff;z-index:0 !important}
.avatar{width:44px;height:44px;border-radius:14.67px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:15px;line-height:24px;flex:none}
.tabs{display:flex;gap:5px;padding:5px;background:#EEF0FB;border-radius:16px;margin:8px 16px}
.tab{flex:1;border-radius:12px;padding:9px 0;text-align:center;font-size:12px;line-height:24px;font-weight:700;color:#7C839C}
.tab.sel{color:#fff}
/* placeholders (nessuna foto reale) */
.ph{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;background:linear-gradient(135deg,#E8EAF6 0%,#D6DAF0 100%);color:#5C6BC0;overflow:hidden}
.ph span{font-size:11px;font-weight:600;letter-spacing:.3px;color:#5C6BC0}
/* slider */
.slider{position:relative;height:48px;margin:0 8px}
.slider .trk{position:absolute;left:0;right:0;top:22px;height:4px;border-radius:2px;background:#E3E1EC}
.slider .act{position:absolute;left:0;top:22px;height:4px;border-radius:2px}
.slider .thumb{position:absolute;top:14px;width:20px;height:20px;border-radius:50%;margin-left:-10px;box-shadow:0 1px 2px rgba(0,0,0,.3),0 1px 3px 1px rgba(0,0,0,.15)}
.slider .tick{position:absolute;top:23px;width:2px;height:2px;border-radius:1px;margin-left:-1px}
/* radio */
.radio{width:48px;height:48px;display:flex;align-items:center;justify-content:center;flex:none}
.radio i{width:20px;height:20px;border-radius:50%;border:2px solid #46464F;display:flex;align-items:center;justify-content:center}
.radio.sel i{border-color:#3949AB}
.radio.sel i::after{content:"";width:10px;height:10px;border-radius:50%;background:#3949AB}
/* switch */
.switch{width:52px;height:32px;border-radius:16px;background:#3949AB;position:relative;flex:none}
.switch::after{content:"";position:absolute;right:4px;top:4px;width:24px;height:24px;border-radius:50%;background:#fff}
/* menu */
.menu{position:absolute;background:#F3EDF7;border-radius:4px;padding:8px 0;box-shadow:0 1px 2px rgba(0,0,0,.3),0 2px 6px 2px rgba(0,0,0,.15);z-index:20}
.menu .mi{height:48px;display:flex;align-items:center;gap:12px;padding:0 12px;font-size:14px;font-weight:500;white-space:nowrap}
.scrollwrap{flex:1;position:relative;overflow:hidden}
.divider{height:1px;background:#CAC4D0}
/* pdf */
.pdfpage{position:absolute;left:0;top:0;width:595px;height:842px;background:#fff;transform-origin:0 0;color:#243042;font-family:"Roboto","Inter","Liberation Sans",sans-serif;letter-spacing:0}
.pdfpage .ab{position:absolute}
</style>

/* gradienti del brand: Brush.linearGradient da (0,0) a (w,h), come in BrandUi.kt */
function applyGradients() {
  document.querySelectorAll("[data-grad]").forEach(el => {
    const r = el.getBoundingClientRect();
    const ang = 90 + Math.atan2(r.height, r.width) * 180 / Math.PI;
    const [a, b] = el.dataset.grad === "deep" ? ["#283593", "#5C6BC0"] : ["#3949AB", "#5C6BC0"];
    el.style.backgroundImage = `linear-gradient(${ang}deg, ${a}, ${b})`;
  });
  document.querySelectorAll("[data-bubbles]").forEach(el => {
    const r = el.getBoundingClientRect();
    const m = Math.min(r.width, r.height);
    const mk = (cx, cy, rad, a) => {
      const d = document.createElement("div");
      d.className = "bubble";
      Object.assign(d.style, { left: (cx - rad) + "px", top: (cy - rad) + "px", width: 2 * rad + "px", height: 2 * rad + "px", opacity: a });
      el.insertBefore(d, el.firstChild);
    };
    mk(r.width * 0.92, r.height * 0.05, m * 0.42, 0.10);
    mk(r.width * 0.04, r.height * 0.55, m * 0.24, 0.07);
  });
}

/* step indicator (GatedStepIndicator.kt) */
function steps(cur, states) {
  // states: per step {done, locked}
  const labels = ["Foto", "Tessuto", "Note"];
  let h = "";
  labels.forEach((l, i) => {
    const st = states[i];
    if (i > 0) h += `<div style="width:16px;height:1px;background:${states[i - 1].done ? C.primary : C.outlineVar}"></div>`;
    let bg = C.sv, inner = `<span class="t-lm" style="color:${C.onSv}">${i + 1}</span>`;
    if (st.done) { bg = C.primary; inner = ic("done", 16, "#fff"); }
    else if (i === cur) { bg = C.pc; inner = `<span class="t-lm" style="color:${C.onPc}">${i + 1}</span>`; }
    else if (st.locked) { inner = ic("morehoriz", 14, C.onSv); }
    h += `<div class="col" style="align-items:center"><div style="width:32px;height:32px;border-radius:50%;background:${bg};display:flex;align-items:center;justify-content:center">${inner}</div><div class="t-lsm" style="padding-top:4px">${l}</div></div>`;
  });
  return `<div class="row" style="flex:none;justify-content:space-evenly;padding:12px 8px">${h}</div>`;
}

/* grafico neutro dei punteggi (ScaleTrendGraph): misure in px Android convertite a 2,625 px/dp */
function trendGraph(scores, min, max, w) {
  const h = 100, dens = 2.625;
  const pad = 8 / dens, bottom = (11 * dens * 1.4 + 8) / dens, chartH = h - bottom, range = max - min;
  let g = "";
  for (let i = 0; i <= 4; i++) {
    const y = pad + (chartH - 2 * pad) * i / 4;
    g += `<line x1="${pad}" y1="${y}" x2="${w - pad}" y2="${y}" stroke="rgba(119,118,128,.3)" stroke-width="${1 / dens}"/>`;
  }
  const pts = scores.map(([d, s], i) => [pad + (w - 2 * pad) * i / (scores.length - 1), pad + (chartH - 2 * pad) * (1 - (s - min) / range), d]);
  for (let i = 0; i < pts.length - 1; i++) g += `<line x1="${pts[i][0]}" y1="${pts[i][1]}" x2="${pts[i + 1][0]}" y2="${pts[i + 1][1]}" stroke="${C.primary}" stroke-width="${2 / dens}"/>`;
  pts.forEach(p => { g += `<circle cx="${p[0]}" cy="${p[1]}" r="${6 / dens}" fill="${C.neutral}"/>`; });
  pts.forEach(p => { g += `<text x="${p[0]}" y="${h - 4 / dens}" font-size="11" fill="${C.outline}" text-anchor="middle" font-family="Roboto,Inter,sans-serif">${p[2]}</text>`; });
  return `<svg width="${w}" height="${h}" style="display:block;overflow:visible">${g}</svg>`;
}
function trendCard(title, sub, scores, min, max, legend) {
  return `<div class="card" style="padding:16px;flex:none">
    <div class="row" style="justify-content:space-between">
      <div><div class="t-tm">${title}</div><div class="t-bs onsv">${sub}</div></div>
      <div class="row" style="gap:4px"><i style="display:block;width:12px;height:12px;border-radius:2px;background:${C.neutral}"></i><span class="t-tl" style="font-weight:600">${scores[scores.length - 1][1]}</span></div>
    </div>
    ${sp(12)}${trendGraph(scores, min, max, 348)}${sp(6)}
    <div class="t-lsm onsv">${legend}</div>
  </div>`;
}
